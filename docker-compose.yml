services:
  relay:
    build: .
    command: node packages/relay/dist/index.js
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - TARGET_URL=http://gateway:3001
      - REDIS_URL=redis://redis:6379
      - RATE_LIMIT_WINDOW_MS=1000
      - RATE_LIMIT_MAX=15
    depends_on:
      redis:
        condition: service_started
      gateway:
        condition: service_started

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - ppg-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  gateway:
    build: .
    command: node packages/gateway/dist/index.js
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - SHARED_KEYS_DIR=/app/.keys
      - FACILITATOR_URL=http://facilitator:3002
    volumes:
      - ppg-keys:/app/.keys
    depends_on:
      facilitator:
        condition: service_started

  facilitator:
    build: .
    command: node packages/facilitator/dist/index.js
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - SHARED_KEYS_DIR=/app/.keys
    volumes:
      - ppg-keys:/app/.keys

volumes:
  ppg-keys:
  ppg-redis:
